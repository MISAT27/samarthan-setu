<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donate - Samarthan Setu</title>
  <link rel="stylesheet" href="donate.css"/>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>
 
  <div class="donate-container">
    <h1>Support Samarthan Setu</h1>
    <p>Your donation helps us make a difference in the lives of many.</p>

    <form id="donation-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="amount">Donation Amount (INR)</label>
      <input type="number" id="amount" name="amount" min="1" required />

      <button type="submit" id="donate-button">Donate Now</button>
    </form>
  </div>

  



  <script>
    const form = document.getElementById("donation-form");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const amount = document.getElementById("amount").value * 100; // in paise

      const options = {
        key: "YOUR_RAZORPAY_KEY_ID", // Replace with your Razorpay Key ID
        amount: amount,
        currency: "INR",
        name: "Samarthan Setu",
        description: "Donation",
        handler: function (response) {
          alert("Thank you for your donation!");
          // You can also send the response.razorpay_payment_id to your server for verification.
        },
        prefill: {
          name: name,
          email: email
        },
        theme: {
          color: "#1e88e5"
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    });

  </script>




</body>
</html>
