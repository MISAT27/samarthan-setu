<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get involved</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="getinvolved.css">
</head>

<body>
    <div class="container">
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Namaskar, Join us</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Namaskar, Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>
        <div class="form-box login">
            <h1>Login</h1>

            <form action="">

                <div>
                    <label for="">Username</label>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                </div>

                <div>
                    <label for="">Password</label>
                    <div class="input-box">
                        <input type="password" placeholder="password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot password</a>
                </div>
                <div><button type="submit" class="btn">Login</button></div>

                <p> or login with social platforms</p>
                <div class="social-icons">
                    <a href="https://www.google.com/"><i class='bx bxl-google'></i></a>
                    <a href="https://www.facebook.com/"><i class='bx bxl-facebook-circle'></i></a>
                    <a href="https://www.instagram.com/"><i class='bx bxl-instagram'></i></a>
                    <a href="https://x.com/"><i class='bx bxl-twitter'></i></a>
                    <a href="https://www.youtube.com/"><i class='bx bxl-youtube'></i></a>
                </div>
            </form>
        </div>
        <div class="form-box register">
            <h1>Registration</h1>


            <form action="">

                <div>
                    <label for="">Username</label>
                    <div class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                </div>

                <div>
                    <label for="">Email</label>
                    <div class="input-box">
                        <input type="email" placeholder="Email" required>
                        <i class='bx bxs-user'></i>
                    </div>
                </div>

                <div>
                    <label for="">Password</label>
                    <div class="input-box">
                        <input type="password" placeholder="password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                </div>

        
                <div><button type="submit" class="btn">Login</button></div>

                <p> or login with social platforms</p>
                <div class="social-icons">
                    <a href="https://www.google.com/"><i class='bx bxl-google'></i></a>
                    <a href="https://www.facebook.com/"><i class='bx bxl-facebook-circle'></i></a>
                    <a href="https://www.instagram.com/"><i class='bx bxl-instagram'></i></a>
                    <a href="https://x.com/"><i class='bx bxl-twitter'></i></a>
                    <a href="https://www.youtube.com/"><i class='bx bxl-youtube'></i></a>
                </div>
            </form>
            
        </div> 
        </div>
    </div>


    

<script src="getinvolved.js"></script>
</body>

</html>
